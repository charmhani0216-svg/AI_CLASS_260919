<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | AVATAR</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <!-- Navigation -->
  <header id="nav">
    <div class="nav-wrap">
      <a href="../../index.html" class="logo">AVATAR</a>
      <nav>
        <ul class="nav-menu">
          <li><a href="../../index.html">홈으로</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Login -->
  <section class="login-section">
    <div class="login-card">
      <h2>Login</h2>
      <p class="login-desc">AVATAR에 오신 것을 환영합니다</p>

      <form class="login-form">
        <input type="email" placeholder="이메일" required />
        <input type="password" placeholder="비밀번호" required />
        <button type="submit" class="btn">로그인</button>
      </form>

      <p class="login-links">계정이 없으신가요?</p>
      <a href="../회원가입/index.html" class="btn-login">회원가입하기</a>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; <span id="year"></span> AVATAR CAFE. All rights reserved.</p>
  </footer>

  <script src="login.js"></script>
</body>
</html>
