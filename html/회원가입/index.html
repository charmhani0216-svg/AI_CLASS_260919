<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up | AVATAR</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="stylesheet" href="signup.css" />
</head>
<body>

  <!-- Navigation -->
  <header id="nav">
    <div class="nav-wrap">
      <a href="../../index.html" class="logo">AVATAR</a>
      <nav>
        <ul class="nav-menu">
          <li><a href="../../index.html">홈으로</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Sign Up -->
  <section class="signup-section">
    <div class="signup-card">
      <h2>Sign Up</h2>
      <p class="signup-desc">AVATAR의 회원이 되어보세요</p>

      <form class="signup-form">
        <input type="text" placeholder="이름" required />
        <input type="email" placeholder="이메일" required />
        <input type="password" placeholder="비밀번호" required />
        <input type="password" placeholder="비밀번호 확인" required />
        <button type="submit" class="btn">회원가입하기</button>
      </form>

      <p class="signup-links">
        이미 계정이 있으신가요? <a href="../로그인/index.html">로그인</a>
      </p>
    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; <span id="year"></span> AVATAR CAFE. All rights reserved.</p>
  </footer>

  <script src="signup.js"></script>
</body>
</html>
